name: Deploy Theme to Shopify

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'config/**'
      - 'layout/**'
      - 'locales/**'
      - 'sections/**'
      - 'snippets/**'
      - 'templates/**'
  workflow_dispatch:
    inputs:
      theme_id:
        description: 'Shopify theme ID (leave empty to use secret)'
        required: false
        default: ''

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Push Theme to Shopify
    runs-on: ubuntu-latest
    needs: test
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Determine theme ID
        id: theme
        run: |
          THEME_ID="${{ github.event.inputs.theme_id }}"
          if [ -z "$THEME_ID" ]; then
            THEME_ID="${{ secrets.SHOPIFY_THEME_ID }}"
          fi
          echo "id=$THEME_ID" >> "$GITHUB_OUTPUT"

      - name: Push theme to Shopify
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_FLAG_STORE: fixaotrixa.myshopify.com
        run: |
          shopify theme push \
            --store fixaotrixa.myshopify.com \
            --theme ${{ steps.theme.outputs.id }} \
            --path . \
            --allow-live \
            --nodelete

      - name: Verify deployment
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          echo "✅ Theme pushed to https://fixaotrixa.myshopify.com"
          echo "Theme ID: ${{ steps.theme.outputs.id }}"
